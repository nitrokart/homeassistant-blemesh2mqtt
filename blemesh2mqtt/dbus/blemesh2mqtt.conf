<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
    "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow send_type="method_call"
           send_interface="org.freedesktop.DBus.ObjectManager"
           send_member="GetManagedObjects"/>
        <allow send_type="method_call"
          send_interface="org.freedesktop.DBus.Properties"
          send_member="GetAll"/>
    <allow send_type="method_call" send_interface="org.bluez.mesh.Application1"/>
    <allow send_type="method_call" send_interface="org.bluez.mesh.ProvisionAgent1"/>
    <allow send_type="method_call" send_interface="org.bluez.mesh.Provisioner1"/>
    <allow send_type="method_call" send_interface="org.bluez.mesh.Element1"/>
  </policy>
</busconfig>