name: Release

# Creates a GitHub release when a version tag such as v0.2.0 is pushed.
# The tag must match `version` in blemesh2mqtt/config.yaml and have a CHANGELOG entry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches the add-on version
        run: |
          version="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' blemesh2mqtt/config.yaml)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match config.yaml version v${version}" >&2
            exit 1
          fi

      - name: Extract release notes from the changelog
        run: |
          awk -v tag="${GITHUB_REF_NAME#v}" '
            index($0, "## " tag) == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' blemesh2mqtt/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No changelog entry for ${GITHUB_REF_NAME}" >&2; exit 1; fi

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
