name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python formatting (black)
        run: |
          pip install black
          black --check blemesh2mqtt/gateway

      - name: Python syntax
        run: python -m compileall -q blemesh2mqtt/gateway

      - name: Shell script (shellcheck)
        run: shellcheck --shell=bash --exclude=SC1008 blemesh2mqtt/run.sh

      - name: YAML manifests
        run: |
          pip install yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' repository.yaml blemesh2mqtt/config.yaml blemesh2mqtt/translations

      - name: Web UI script parses
        run: |
          python - <<'PY'
          import re, subprocess, tempfile, pathlib
          html = pathlib.Path("blemesh2mqtt/gateway/web/static/index.html").read_text()
          script = re.search(r"<script>(.*?)</script>", html, re.S).group(1)
          f = pathlib.Path(tempfile.mkdtemp()) / "ui.js"
          f.write_text(script)
          subprocess.run(["node", "--check", str(f)], check=True)
          PY

  addon-linter:
    name: Home Assistant add-on linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./blemesh2mqtt

  docker:
    name: Build image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Compiles BlueZ 5.87 with the Remote Provisioning patch; the build fails if the patch does not apply.
      - uses: docker/build-push-action@v6
        with:
          context: ./blemesh2mqtt
          platforms: ${{ matrix.platform }}
          build-args: BUILD_ARCH=${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
