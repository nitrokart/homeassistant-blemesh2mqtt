<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc">
  <title id="title">Bluetooth Mesh to MQTT architecture</title>
  <desc id="desc">A Bluetooth Mesh light communicates through a Bluetooth adapter and the add-on. The add-on exchanges discovery, state, and commands with the MQTT broker, which connects to Home Assistant.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#476579"/>
    </marker>
    <style>
      .box { fill: #f4f8fb; stroke: #7895a8; stroke-width: 2; }
      .ha { fill: #eef7f1; stroke: #4b8b68; }
      .label { fill: #172b3a; font: 700 18px system-ui, sans-serif; text-anchor: middle; }
      .small { fill: #405767; font: 14px system-ui, sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #476579; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .flow { fill: #405767; font: 12px system-ui, sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect x="20" y="72" width="190" height="150" rx="16" class="box"/>
  <text x="115" y="125" class="label">Mesh light</text>
  <text x="115" y="155" class="small">Bluetooth Mesh</text>
  <text x="115" y="180" class="small">On/off · brightness · CTL*</text>

  <rect x="245" y="72" width="190" height="150" rx="16" class="box"/>
  <text x="340" y="125" class="label">Bluetooth adapter</text>
  <text x="340" y="155" class="small">Dedicated adapter</text>
  <text x="340" y="180" class="small">in exclusive use</text>

  <rect x="470" y="72" width="190" height="150" rx="16" class="box"/>
  <text x="565" y="125" class="label">BLE Mesh add-on</text>
  <text x="565" y="155" class="small">Pair and manage lights</text>
  <text x="565" y="180" class="small">Publishes MQTT discovery</text>

  <rect x="695" y="72" width="170" height="150" rx="16" class="ha"/>
  <text x="780" y="125" class="label">MQTT broker</text>
  <text x="780" y="155" class="small">For example,</text>
  <text x="780" y="180" class="small">Mosquitto</text>

  <rect x="900" y="72" width="180" height="150" rx="16" class="ha"/>
  <text x="990" y="125" class="label">Home Assistant</text>
  <text x="990" y="155" class="small">MQTT integration</text>
  <text x="990" y="180" class="small">Light entity &amp; dashboard</text>

  <path d="M210 147 H245" class="arrow"/>
  <path d="M435 147 H470" class="arrow"/>
  <path d="M660 147 H695" class="arrow"/>
  <path d="M865 147 H900" class="arrow"/>
  <text x="550" y="252" class="flow">State flows toward Home Assistant; commands flow back to the light.</text>
  <text x="550" y="285" class="small">*Only capabilities advertised by supported Bluetooth Mesh models are exposed.</text>
</svg>
